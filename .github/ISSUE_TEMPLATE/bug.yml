name: Something's wrong
description: A wrong number, a broken page, or a wiring diagram that doesn't match reality
labels: ["bug"]
body:
  - type: dropdown
    id: tab
    attributes:
      label: Which part of the app?
      options:
        - Dimensions / DimentionatorX
        - Saddle / nut compensation
        - String spacing
        - Unit converter
        - IR calculator
        - Wired! (wiring designer)
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What did you enter, and what did the app show?
      description: Numbers, settings, or a screenshot. For wiring, the pickups and switch you used.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and how do you know?
      description: A book, maker's diagram, or what you measured on the bench.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: e.g. Chrome on Windows, Safari on iPhone
